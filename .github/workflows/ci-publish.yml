name: CI & PyPI Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    name: Test & Strict Typing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Strict Type Check (mypy)
        run: |
          uv run mypy --strict pareto_router tests

      - name: Run Test Suite (pytest)
        run: |
          uv run pytest -v --durations=10

      - name: Run Latency & Cost Benchmarks Verification
        run: |
          uv run python -m pareto_router.benchmarks.run_benchmarks

  build-and-publish:
    name: Build Wheel & Publish to PyPI
    needs: [test-and-typecheck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pareto-router
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Source Distribution and Wheel
        run: |
          uv build

      - name: Verify Distribution Artifacts
        run: |
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # Note: If not using OIDC Trusted Publishing, set repository secret PYPI_API_TOKEN:
          # password: ${{ secrets.PYPI_API_TOKEN }}
