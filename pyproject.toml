[project]
name = "pareto-router"
version = "0.1.2"
description = "Sub-millisecond 2D model-tier and reasoning-effort routing for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sandeep Hipparagi" }
]
keywords = [
    "llm",
    "routing",
    "inference",
    "pareto",
    "cost-optimization",
    "reasoning-effort",
    "openai",
    "anthropic",
    "gemini",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Sandeep-Hipparagi/Inference-Pareto-Router"
Repository = "https://github.com/Sandeep-Hipparagi/Inference-Pareto-Router"
Issues = "https://github.com/Sandeep-Hipparagi/Inference-Pareto-Router/issues"
Changelog = "https://github.com/Sandeep-Hipparagi/Inference-Pareto-Router/releases"

[project.scripts]
pareto-router = "pareto_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pareto_router"]

[tool.hatch.build.targets.sdist]
include = ["pareto_router", "tests", "examples", "README.md", "LICENSE", "pyproject.toml", "benchmark_results.json"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
